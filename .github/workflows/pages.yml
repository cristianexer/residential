name: Deploy INTERMEDIA explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate browser assets
        run: python3 scripts/validate_assets.py

      - name: Validate browser entrypoint
        run: node --check dist/viewer.js

      - name: Verify Pages package
        run: test -f dist/index.html && test -f dist/viewer.js && test -f dist/assets/intermedia-residential.glb && test -f dist/assets/intermedia-residential.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static explorer
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
